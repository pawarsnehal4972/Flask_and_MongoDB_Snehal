<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Submit Data</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="container">
  <h1>Submit Your Details</h1>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="{{ url_for('form') }}">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ values.get('name', '') }}" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ values.get('email', '') }}" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="4" required>{{ values.get('message', '') }}</textarea>

    <button type="submit">Submit</button>
  </form>
</div></body>
</html>
